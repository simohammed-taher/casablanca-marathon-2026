<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Casa 2026">
  <title>Casablanca Marathon 2026 — Course map</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1915;
      --muted: #6f675e;
      --paper: #f7f3ea;
      --paper-2: #fffdf8;
      --line: rgba(28, 25, 21, 0.1);
      --accent: #0f6e56;
      --half: #0f6e56;
      --full: #c4491d;
      --shadow: 0 18px 44px rgba(48, 32, 14, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      font-family: Outfit, "Segoe UI", sans-serif;
      background: #d7d0c4;
    }

    #map {
      position: fixed;
      inset: 0;
    }

    .loading {
      position: fixed;
      z-index: 400;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.94);
      color: var(--muted);
      font-size: 13px;
      box-shadow: var(--shadow);
    }

    .panel {
      position: fixed;
      z-index: 1000;
      top: 16px;
      left: 16px;
      width: min(336px, calc(100vw - 32px));
      max-height: calc(100dvh - 32px);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 16px 16px 14px;
      border-radius: 18px;
      border: 1px solid rgba(28, 25, 21, 0.08);
      border-top: 4px solid var(--accent);
      background: var(--paper-2);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 2px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .text-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    .text-btn:hover { color: var(--ink); }

    .switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .switch button {
      border: 0;
      border-radius: 12px;
      padding: 10px 8px 8px;
      background: transparent;
      color: var(--btn, var(--ink));
      box-shadow: inset 0 0 0 1.5px var(--btn, var(--ink));
      cursor: pointer;
      text-align: center;
    }

    .switch button[data-route="21"] { --btn: var(--half); }
    .switch button[data-route="42"] { --btn: var(--full); }

    .switch button b {
      display: block;
      font-family: Fraunces, Georgia, serif;
      font-size: 32px;
      font-weight: 560;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    .switch button span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .switch button[aria-checked="true"] {
      background: var(--btn);
      color: white;
      box-shadow: none;
    }

    .kind {
      margin: 14px 0 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .distance {
      margin: 2px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 42px;
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .name {
      margin: 4px 0 0;
      font-size: 15px;
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 0;
    }

    .facts div {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--paper);
    }

    .facts dt {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .facts dd {
      margin: 2px 0 0;
      font-size: 16px;
      font-weight: 600;
    }

    .elev {
      margin: 12px 0 0;
    }

    .elev figcaption {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #spark {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 4px;
    }

    .elev-scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .hint, .file {
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .file {
      font-size: 11px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: var(--ink);
      color: var(--paper);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .actions button:hover { background: #322c26; }

    #track {
      background: var(--accent);
    }

    #track[aria-pressed="true"] {
      background: var(--ink);
    }

    .actions button.ghost {
      background: transparent;
      color: var(--ink);
      box-shadow: inset 0 0 0 1.5px rgba(28, 25, 21, 0.18);
    }

    .actions button.ghost:hover { background: var(--paper); }

    .along {
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      min-height: 2.7em;
      font-size: 13px;
      line-height: 1.4;
    }

    .along strong {
      font-family: Fraunces, Georgia, serif;
      font-size: 16px;
      font-weight: 560;
    }

    .panel.is-off { border-top-color: #9a3412; }

    .deviation {
      position: fixed;
      z-index: 1200;
      left: 16px;
      right: 16px;
      bottom: 24px;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 18px;
      border-radius: 16px;
      background: #9a3412;
      color: white;
      box-shadow: var(--shadow);
    }

    .deviation h2 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .deviation p {
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .panel.is-collapsed .details { display: none; }

    .panel.is-collapsed { width: min(336px, calc(100vw - 32px)); }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .end-mark, .km-mark, .hover-dot {
      user-select: none;
    }

    .end-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-family: Fraunces, Georgia, serif;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .km-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 10px;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .hover-dot,
    .you-mark {
      pointer-events: none;
    }

    .hover-dot {
      width: 14px;
      height: 14px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .you-mark {
      width: 16px;
      height: 16px;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 32%, transparent);
    }

    @media (prefers-reduced-motion: no-preference) {
      .you-mark {
        animation: you-pulse 1.8s ease-out infinite;
      }
    }

    @keyframes you-pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
      100% { box-shadow: 0 0 0 16px transparent; }
    }

    .course-popup { pointer-events: none; }

    .maplibregl-popup-content {
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--ink);
      font-family: Outfit, "Segoe UI", sans-serif;
      box-shadow: 0 10px 24px rgba(40, 28, 12, 0.18);
    }

    .maplibregl-popup-content strong {
      display: block;
      font-family: Fraunces, Georgia, serif;
      font-size: 15px;
      font-weight: 560;
    }

    .maplibregl-popup-content span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .course-popup .maplibregl-popup-content {
      background: var(--ink);
      color: var(--paper);
    }

    .course-popup .maplibregl-popup-content span { color: #e4d9c8; }
    .course-popup.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--ink); }
    .course-popup.maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--ink); }

    .maplibregl-ctrl-group {
      border: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .maplibregl-ctrl-group button {
      width: 36px;
      height: 36px;
    }

    .maplibregl-ctrl-attrib {
      font-family: Outfit, "Segoe UI", sans-serif;
      font-size: 11px;
      background: rgba(255, 253, 248, 0.92);
    }

    .banner {
      position: fixed;
      z-index: 1100;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      max-width: min(520px, calc(100% - 32px));
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: #3d1f14;
      color: white;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: var(--shadow);
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    @media (max-width: 720px) {
      .panel {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: auto;
        max-height: min(58dvh, 460px);
        border-radius: 22px 22px 0 0;
        border-top-width: 4px;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      }

      .panel.is-collapsed {
        width: auto;
        max-height: none;
      }

      .panel.is-collapsed .panel-head,
      .panel.is-collapsed .details {
        display: none;
      }

      .switch { margin-top: 0; gap: 8px; }
      .switch button { min-height: 48px; padding: 6px 8px 5px; }
      .switch button b { font-size: 24px; }
      .actions { margin-top: 8px; }
      .actions button { min-height: 44px; padding: 8px 14px; }
      .along {
        margin-top: 8px;
        padding-top: 8px;
        min-height: 0;
      }
      h1 { font-size: 22px; }
      .distance { font-size: 32px; }

      .deviation {
        top: calc(10px + env(safe-area-inset-top));
        bottom: auto;
        left: 12px;
        right: 12px;
        padding: 14px 16px;
      }

      .deviation h2 { font-size: 24px; }

      .loading { bottom: auto; top: calc(12px + env(safe-area-inset-top)); }

      .maplibregl-ctrl-bottom-left,
      .maplibregl-ctrl-bottom-right {
        bottom: auto;
        top: calc(10px + env(safe-area-inset-top));
      }

      .maplibregl-ctrl-bottom-left { left: 8px; }
      .maplibregl-ctrl-bottom-right { right: 8px; }

      .maplibregl-ctrl-group button {
        width: 44px;
        height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Street map of the Casablanca Marathon courses"></div>
  <p class="loading" id="loading">Loading the street map…</p>

  <aside class="panel" id="panel">
    <header class="panel-head">
      <div>
        <p class="kicker">Casablanca Marathon</p>
        <h1>2026 course</h1>
      </div>
    </header>

    <div class="switch" role="radiogroup" aria-label="Course distance">
      <button type="button" role="radio" id="btn-21" data-route="21" aria-checked="false">
        <b>21</b>
        <span>km · half</span>
      </button>
      <button type="button" role="radio" id="btn-42" data-route="42" aria-checked="false">
        <b>42</b>
        <span>km · full</span>
      </button>
    </div>

    <div class="actions">
      <button type="button" id="track" aria-pressed="false">Guide me</button>
      <button type="button" id="recenter" class="ghost" hidden>Recenter</button>
      <button type="button" class="ghost" id="collapse" aria-expanded="true" aria-controls="details">Map only</button>
    </div>
    <p class="along" id="along">Guide me to follow the course from your location.</p>

    <div class="details" id="details">
      <p class="kind" id="kind"></p>
      <p class="distance" id="distance"></p>
      <p class="name" id="name"></p>
      <dl class="facts">
        <div>
          <dt>Climb</dt>
          <dd id="climb"></dd>
        </div>
        <div>
          <dt>Shape</dt>
          <dd id="shape"></dd>
        </div>
      </dl>
      <figure class="elev">
        <figcaption>Elevation</figcaption>
        <svg id="spark" viewBox="0 0 280 46" preserveAspectRatio="none" role="img" aria-label="Elevation profile"></svg>
        <div class="elev-scale">
          <span id="ele-min"></span>
          <span id="ele-max"></span>
        </div>
      </figure>
      <p class="hint">Guide me follows your location along the course. If you leave the route, the map warns you and points you back.</p>
      <p class="file" id="file"></p>
      <div class="actions">
        <button type="button" id="fit" class="ghost">Show full course</button>
      </div>
    </div>
  </aside>

  <div id="deviation" class="deviation" hidden role="alert" aria-live="assertive">
    <h2>You've left the route</h2>
    <p id="deviation-detail"></p>
  </div>

  <p class="banner" id="errors" hidden></p>
  <p class="sr" id="live" aria-live="polite"></p>

  <script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>
  <script src="routes.js"></script>
  <script>
    const FILES = {
      "21": "casablanca-marathon-2026-21km.gpx",
      "42": "casablanca-marathon-2026-42km.gpx"
    };

    const errors = document.getElementById("errors");
    const loading = document.getElementById("loading");

    function fail(message) {
      errors.hidden = false;
      errors.textContent = message;
      loading.hidden = true;
    }

    if (location.protocol === "file:") {
      fail("Open this page through a local server so the street map can load. In this folder, run: python -m http.server 8765");
    }

    if (!window.maplibregl || !window.ROUTES) {
      fail("The map library or the course files did not load. Refresh the page once you are online.");
    }

    function haversine(a, b) {
      const R = 6371000;
      const toRad = Math.PI / 180;
      const p1 = a[0] * toRad;
      const p2 = b[0] * toRad;
      const dp = (b[0] - a[0]) * toRad;
      const dl = (b[1] - a[1]) * toRad;
      const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function prepare(route) {
      const cum = [0];
      let gain = 0;
      for (let i = 1; i < route.points.length; i += 1) {
        cum.push(cum[i - 1] + haversine(route.points[i - 1], route.points[i]));
        gain += Math.max(0, route.points[i][2] - route.points[i - 1][2]);
      }
      const total = cum[cum.length - 1];
      const loop = haversine(route.points[0], route.points[route.points.length - 1]) < 80;
      return { ...route, cum, total, gain, loop };
    }

    const prepared = Object.fromEntries(
      Object.entries(window.ROUTES || {}).map(([id, route]) => [id, prepare(route)])
    );

    const PROGRESS_KEY = "casa-marathon-progress";

    function loadProgress() {
      try {
        const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
        return data && typeof data === "object" ? data : {};
      } catch (error) {
        return {};
      }
    }

    function saveProgress() {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    }

    let progress = loadProgress();
    let tracking = false;
    let liveGuide = null;
    let offRoute = false;
    let lastInstruction = { type: "straight" };
    let pathHistory = [];
    let spokenKey = "";
    let follow = false;
    let watchId = null;
    let wakeLock = null;
    let youMarker = null;

    function formatKm(meters) {
      return (meters / 1000).toFixed(2) + " km";
    }

    function pointAt(route, meters) {
      const { points, cum, total } = route;
      if (meters <= 0) return { lat: points[0][0], lng: points[0][1], ele: points[0][2] };
      if (meters >= total) {
        const last = points[points.length - 1];
        return { lat: last[0], lng: last[1], ele: last[2] };
      }
      let i = 1;
      while (cum[i] < meters) i += 1;
      const span = cum[i] - cum[i - 1] || 1;
      const t = (meters - cum[i - 1]) / span;
      const a = points[i - 1];
      const b = points[i];
      return {
        lat: a[0] + (b[0] - a[0]) * t,
        lng: a[1] + (b[1] - a[1]) * t,
        ele: a[2] + (b[2] - a[2]) * t
      };
    }

    function closest(lngLat, route) {
      let best = Infinity;
      let result = null;
      const lat = lngLat.lat;
      const lng = lngLat.lng;
      for (let i = 1; i < route.points.length; i += 1) {
        const a = route.points[i - 1];
        const b = route.points[i];
        const dx = b[1] - a[1];
        const dy = b[0] - a[0];
        const len2 = dx * dx + dy * dy;
        let t = len2 === 0 ? 0 : ((lng - a[1]) * dx + (lat - a[0]) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        const plat = a[0] + dy * t;
        const plng = a[1] + dx * t;
        const cos = Math.cos(plat * Math.PI / 180);
        const away = Math.hypot((lat - plat) * 111320, (lng - plng) * 111320 * cos);
        if (away < best) {
          best = away;
            result = {
            along: route.cum[i - 1] + t * (route.cum[i] - route.cum[i - 1]),
            lat: plat,
            lng: plng,
            ele: a[2] + t * (b[2] - a[2]),
            away
          };
        }
      }
      return result;
    }

    function lineString(points) {
      return {
        type: "Feature",
        properties: {},
        geometry: {
          type: "LineString",
          coordinates: points.map((point) => [point[1], point[0]])
        }
      };
    }

    function drawSpark(route) {
      const samples = 80;
      const eles = [];
      for (let i = 0; i < samples; i += 1) {
        eles.push(pointAt(route, route.total * i / (samples - 1)).ele);
      }
      const min = Math.min(...eles);
      const max = Math.max(...eles);
      const span = max - min || 1;
      const width = 280;
      const height = 46;
      const coords = eles.map((ele, index) => {
        const x = (index / (samples - 1)) * width;
        const y = 3 + (1 - (ele - min) / span) * (height - 6);
        return [x, y];
      });
      const line = coords.map((pair, index) => `${index ? "L" : "M"}${pair[0].toFixed(1)} ${pair[1].toFixed(1)}`).join(" ");
      const svg = document.getElementById("spark");
      const mark = tracking && liveGuide && liveGuide.along > 0
        ? `<line x1="${((liveGuide.along / route.total) * width).toFixed(1)}" y1="0" x2="${((liveGuide.along / route.total) * width).toFixed(1)}" y2="${height}" stroke="${route.color}" stroke-width="1.5"></line>`
        : "";
      svg.innerHTML = `<path d="${line} L${width} ${height} L0 ${height} Z" fill="${route.color}" opacity="0.16"></path><path d="${line}" fill="none" stroke="${route.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>${mark}`;
      document.getElementById("ele-min").textContent = Math.round(min) + " m";
      document.getElementById("ele-max").textContent = Math.round(max) + " m";
    }

    const kindEl = document.getElementById("kind");
    const distanceEl = document.getElementById("distance");
    const nameEl = document.getElementById("name");
    const climbEl = document.getElementById("climb");
    const shapeEl = document.getElementById("shape");
    const fileEl = document.getElementById("file");
    const alongEl = document.getElementById("along");
    const liveEl = document.getElementById("live");
    const panel = document.getElementById("panel");

    let activeId = null;
    let map = null;
    let popup = null;
    let mapReady = false;
    let pinned = false;
    let hoverMarker = null;
    let endMarkers = [];
    let kmMarkers = [];

    function updatePanel(route) {
      document.documentElement.style.setProperty("--accent", route.color);
      kindEl.textContent = route.title;
      distanceEl.textContent = formatKm(route.total);
      nameEl.textContent = route.name;
      climbEl.textContent = "+" + Math.round(route.gain) + " m";
      shapeEl.textContent = route.loop ? "Loop" : "Point to point";
      fileEl.textContent = FILES[route.id];
      drawSpark(route);
      document.querySelectorAll(".switch button").forEach((button) => {
        button.setAttribute("aria-checked", button.dataset.route === route.id ? "true" : "false");
      });
      document.title = route.label + " km · Casablanca Marathon 2026";
      liveEl.textContent = "Showing the " + route.label + " km " + route.title.toLowerCase() + ", " + formatKm(route.total) + ".";
      if (location.hash !== "#" + route.id) history.replaceState(null, "", "#" + route.id);
      renderStatus();
    }

    function resetAlong() {
      renderStatus();
    }

    function bearingOf(a, b) {
      const toRad = Math.PI / 180;
      const y = Math.sin((b.lng - a.lng) * toRad) * Math.cos(b.lat * toRad);
      const x = Math.cos(a.lat * toRad) * Math.sin(b.lat * toRad)
        - Math.sin(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.cos((b.lng - a.lng) * toRad);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function angleDelta(from, to) {
      let delta = to - from;
      while (delta > 180) delta -= 360;
      while (delta < -180) delta += 360;
      return delta;
    }

    function cardinal(degrees) {
      const names = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
      return names[Math.round((((degrees % 360) + 360) % 360) / 45) % 8];
    }

    function routeBearing(route, along, aheadMeters) {
      const from = pointAt(route, along);
      const to = pointAt(route, Math.min(route.total, along + aheadMeters));
      return bearingOf(from, to);
    }

    function nextInstruction(route, along, heading) {
      const ahead = routeBearing(route, along, 35);
      if (heading != null && Math.abs(angleDelta(heading, ahead)) > 130) return { type: "around" };
      let previous = ahead;
      for (let distance = 40; distance <= 160; distance += 20) {
        const sample = routeBearing(route, Math.min(route.total - 1, along + distance), 30);
        const delta = angleDelta(previous, sample);
        if (Math.abs(delta) >= 45) {
          return { type: "turn", direction: delta > 0 ? "right" : "left", distance };
        }
        previous = sample;
      }
      return { type: "straight" };
    }

    function returnText(user, snap, heading) {
      const meters = Math.max(1, Math.round(snap.away));
      const back = bearingOf(user, { lat: snap.lat, lng: snap.lng });
      if (heading == null) return "The course is " + meters + " m to the " + cardinal(back) + ".";
      const relative = angleDelta(heading, back);
      let side = "ahead";
      if (relative > 150 || relative < -150) side = "behind you";
      else if (relative > 25) side = "to your right";
      else if (relative < -25) side = "to your left";
      return "The course is " + meters + " m " + side + ".";
    }

    function sayOnce(key, text, vibrate) {
      if (spokenKey === key) return;
      spokenKey = key;
      if (vibrate && navigator.vibrate) navigator.vibrate(vibrate);
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
    }

    function showDeviation(detail) {
      const box = document.getElementById("deviation");
      box.hidden = false;
      document.getElementById("deviation-detail").textContent = detail;
      panel.classList.add("is-off");
    }

    function hideDeviation() {
      document.getElementById("deviation").hidden = true;
      document.getElementById("deviation-detail").textContent = "";
      panel.classList.remove("is-off");
    }

    function renderStatus() {
      const route = prepared[activeId];
      if (!route) return;
      if (!tracking || !liveGuide) {
        kindEl.textContent = route.title;
        distanceEl.textContent = formatKm(route.total);
        if (!hoverMarker && !pinned) {
          alongEl.textContent = tracking
            ? "Finding your location…"
            : "Guide me to follow the course from your location.";
        }
        return;
      }
      renderGuide(route, lastInstruction);
    }

    function renderGuide(route, instruction) {
      const left = Math.max(0, route.total - liveGuide.along);
      drawSpark(route);
      if (offRoute) {
        kindEl.textContent = "Off the route";
        distanceEl.textContent = Math.round(liveGuide.away) + " m";
        alongEl.innerHTML = "<strong>You've left the route.</strong> " + document.getElementById("deviation-detail").textContent;
        return;
      }
      if (instruction.type === "around") {
        kindEl.textContent = "Wrong way";
        distanceEl.textContent = "Turn around";
        alongEl.textContent = "The course continues the other way.";
        return;
      }
      if (instruction.type === "turn") {
        kindEl.textContent = "Turn " + instruction.direction;
        distanceEl.textContent = instruction.distance + " m";
        alongEl.innerHTML = `<strong>${formatKm(left)}</strong> left on the course.`;
        return;
      }
      kindEl.textContent = "Continue";
      distanceEl.textContent = formatKm(left);
      alongEl.textContent = "Stay on the colored line.";
    }

    function sliceLine(route, from, to) {
      const start = pointAt(route, from);
      const end = pointAt(route, to);
      const coords = [[start.lng, start.lat]];
      for (let i = 0; i < route.points.length; i += 1) {
        const distance = route.cum[i];
        if (distance > from + 0.5 && distance < to - 0.5) {
          coords.push([route.points[i][1], route.points[i][0]]);
        }
      }
      coords.push([end.lng, end.lat]);
      return {
        type: "Feature",
        properties: {},
        geometry: { type: "LineString", coordinates: coords }
      };
    }

    function emptyLine() {
      return { type: "FeatureCollection", features: [] };
    }

    function paintProgress(route) {
      if (!mapReady || !map.getSource("remaining")) return;
      const active = tracking && liveGuide && liveGuide.along > 1 && liveGuide.along < route.total - 1;
      map.setPaintProperty("course-line", "line-opacity", active ? 0.18 : 1);
      map.getSource("done").setData(active ? sliceLine(route, 0, liveGuide.along) : emptyLine());
      map.getSource("remaining").setData(active ? sliceLine(route, liveGuide.along, route.total) : emptyLine());
      map.setPaintProperty("remaining-line", "line-color", route.color);
      placeYou();
    }

    function placeYou() {
      if (!tracking || !liveGuide || !mapReady) {
        if (youMarker) {
          youMarker.remove();
          youMarker = null;
        }
        return;
      }
      if (!youMarker) {
        const el = document.createElement("div");
        el.className = "you-mark";
        el.setAttribute("aria-label", "Your location");
        youMarker = new maplibregl.Marker({ element: el, anchor: "center" })
          .setLngLat([liveGuide.lng, liveGuide.lat])
          .addTo(map);
      } else {
        youMarker.setLngLat([liveGuide.lng, liveGuide.lat]);
      }
    }

    function updateTrackButtons() {
      const button = document.getElementById("track");
      const recenter = document.getElementById("recenter");
      button.setAttribute("aria-pressed", tracking ? "true" : "false");
      button.textContent = tracking ? "Stop guiding" : "Guide me";
      recenter.hidden = !(tracking && !follow);
    }

    async function keepAwake() {
      try {
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
      } catch (error) {
        wakeLock = null;
      }
    }

    function releaseAwake() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    let lastFollowAt = 0;

    function movementHeading(position) {
      const speed = position.coords.speed;
      if (typeof position.coords.heading === "number" && !Number.isNaN(position.coords.heading) && speed > 0.6) {
        return position.coords.heading;
      }
      pathHistory.push({ lat: position.coords.latitude, lng: position.coords.longitude });
      if (pathHistory.length > 5) pathHistory.shift();
      if (pathHistory.length < 2) return null;
      const start = pathHistory[0];
      const end = pathHistory[pathHistory.length - 1];
      if (haversine([start.lat, start.lng], [end.lat, end.lng]) < 8) return null;
      return bearingOf(start, end);
    }

    function followUser() {
      if (!follow || !mapReady || !liveGuide) return;
      const now = Date.now();
      if (now - lastFollowAt < 700) return;
      lastFollowAt = now;
      const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (liveGuide.away > 80) {
        const bounds = new maplibregl.LngLatBounds(
          [liveGuide.lng, liveGuide.lat],
          [liveGuide.snapLng, liveGuide.snapLat]
        );
        map.fitBounds(bounds, { padding: 90, maxZoom: 16, duration: motion ? 0 : 600 });
        return;
      }
      map.easeTo({
        center: [liveGuide.lng, liveGuide.lat],
        bearing: liveGuide.heading == null ? map.getBearing() : liveGuide.heading,
        zoom: Math.max(map.getZoom(), 16.5),
        duration: motion ? 0 : 650,
        essential: true
      });
    }

    function onFix(position) {
      const route = prepared[activeId];
      if (!route) return;
      const accuracy = position.coords.accuracy;
      if (accuracy > 80) {
        alongEl.textContent = "Waiting for a sharper location fix…";
        return;
      }
      const user = { lat: position.coords.latitude, lng: position.coords.longitude };
      const snap = closest(user, route);
      const heading = movementHeading(position);
      const wasOff = offRoute;
      if (!(accuracy > 30)) {
        if (!offRoute && snap.away > 40) offRoute = true;
        else if (offRoute && snap.away < 22) offRoute = false;
      }
      liveGuide = {
        lat: user.lat,
        lng: user.lng,
        along: snap.along,
        away: snap.away,
        snapLat: snap.lat,
        snapLng: snap.lng,
        heading
      };
      if (mapReady) {
        paintProgress(route);
        const backLine = offRoute ? {
          type: "Feature",
          properties: {},
          geometry: {
            type: "LineString",
            coordinates: [[user.lng, user.lat], [snap.lng, snap.lat]]
          }
        } : emptyLine();
        if (map.getSource("return-path")) map.getSource("return-path").setData(backLine);
      }
      const instruction = offRoute ? { type: "straight" } : nextInstruction(route, snap.along, heading);
      lastInstruction = instruction;
      const detail = returnText(user, snap, heading);
      if (offRoute && !wasOff) {
        showDeviation(detail);
        sayOnce("off", "You've left the route. " + detail, [200, 100, 200, 100, 200]);
      } else if (!offRoute && wasOff) {
        hideDeviation();
        sayOnce("on", "You're back on the route.", 80);
      } else if (offRoute) {
        showDeviation(detail);
      } else if (instruction.type === "turn" && instruction.distance <= 100) {
        sayOnce(
          "turn-" + route.id + "-" + Math.round((snap.along + instruction.distance) / 30),
          "Turn " + instruction.direction + " in " + instruction.distance + " meters"
        );
      } else if (instruction.type === "around") {
        sayOnce("around", "Turn around. You are going the wrong way on the course.", [120, 80, 120]);
      }
      if (instruction.type !== "around" && spokenKey === "around") spokenKey = "";
      renderGuide(route, instruction);
      followUser();
    }

    function onGeoError(error) {
      if (error && error.code === 1) {
        stopTracking();
        alongEl.textContent = "Location is blocked. Allow location for this site, then press Guide me again.";
        return;
      }
      alongEl.textContent = "Waiting for a location fix…";
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alongEl.textContent = "This browser cannot read your location.";
        return;
      }
      if (!window.isSecureContext) {
        alongEl.textContent = "Location guidance needs the secure Vercel address, not a file saved on the phone.";
        return;
      }
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      tracking = true;
      follow = true;
      offRoute = false;
      liveGuide = null;
      pathHistory = [];
      spokenKey = "";
      lastFollowAt = 0;
      hideDeviation();
      updateTrackButtons();
      renderStatus();
      watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 20000
      });
      keepAwake();
    }

    function stopTracking() {
      tracking = false;
      follow = false;
      offRoute = false;
      liveGuide = null;
      pathHistory = [];
      if (watchId != null && navigator.geolocation) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      releaseAwake();
      hideDeviation();
      if (youMarker) {
        youMarker.remove();
        youMarker = null;
      }
      if (mapReady && map.getSource("return-path")) map.getSource("return-path").setData(emptyLine());
      if (mapReady && prepared[activeId]) {
        paintProgress(prepared[activeId]);
        map.easeTo({ bearing: 0, duration: 300 });
      }
      updateTrackButtons();
      renderStatus();
    }

    function hideHover() {
      if (hoverMarker) {
        hoverMarker.remove();
        hoverMarker = null;
      }
      if (popup) popup.remove();
      if (map && map.getCanvas()) map.getCanvas().style.cursor = "";
      resetAlong();
    }

    function showHover(info, isPinned) {
      if (!hoverMarker) {
        const el = document.createElement("div");
        el.className = "hover-dot";
        hoverMarker = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([info.lng, info.lat]).addTo(map);
      } else {
        hoverMarker.setLngLat([info.lng, info.lat]);
      }
      popup
        .setLngLat([info.lng, info.lat])
        .setHTML(`<strong>${formatKm(info.along)}</strong><span>${Math.round(info.ele)} m elevation</span>`)
        .addTo(map);
      map.getCanvas().style.cursor = "crosshair";
      const note = isPinned ? " Click the map to clear." : " Click to pin this point.";
      alongEl.innerHTML = `<strong>${formatKm(info.along)}</strong> along the course · ${Math.round(info.ele)} m.${note}`;
    }

    function pixelDistance(info, point) {
      const projected = map.project([info.lng, info.lat]);
      return Math.hypot(projected.x - point.x, projected.y - point.y);
    }

    function clearMarkers(list) {
      list.forEach((marker) => marker.remove());
      list.length = 0;
    }

    function addMarker(list, lngLat, className, text, title, detail) {
      const el = document.createElement("div");
      el.className = className;
      el.textContent = text;
      el.setAttribute("aria-label", title);
      const marker = new maplibregl.Marker({ element: el, anchor: "center" })
        .setLngLat(lngLat)
        .setPopup(new maplibregl.Popup({ offset: 16, closeButton: false }).setHTML(`<strong>${title}</strong><span>${detail}</span>`))
        .addTo(map);
      list.push(marker);
      return marker;
    }

    function placeEnds(route) {
      clearMarkers(endMarkers);
      const start = route.points[0];
      const end = route.points[route.points.length - 1];
      if (route.loop) {
        addMarker(endMarkers, [start[1], start[0]], "end-mark", "S", "Start and finish", route.title);
      } else {
        addMarker(endMarkers, [start[1], start[0]], "end-mark", "S", "Start", route.title);
        addMarker(endMarkers, [end[1], end[0]], "end-mark", "F", "Finish", route.title);
      }
    }

    function kmStep(zoom) {
      if (zoom < 13) return 5000;
      if (zoom < 15) return 2000;
      return 1000;
    }

    function placeKm(route) {
      clearMarkers(kmMarkers);
      if (!mapReady) return;
      const step = kmStep(map.getZoom());
      const occupied = endMarkers.map((marker) => map.project(marker.getLngLat()));
      for (let meters = step; meters < route.total - 150; meters += step) {
        const spot = pointAt(route, meters);
        const point = map.project([spot.lng, spot.lat]);
        const crowded = occupied.some((other) => Math.hypot(other.x - point.x, other.y - point.y) < 28);
        if (crowded) continue;
        occupied.push(point);
        const km = Math.round(meters / 1000);
        addMarker(kmMarkers, [spot.lng, spot.lat], "km-mark", String(km), km + " km", route.title);
      }
    }

    function padding() {
      const rect = panel.getBoundingClientRect();
      if (window.innerWidth < 720) {
        const bottom = Math.max(24, Math.round(window.innerHeight - rect.top + 16));
        return { top: 72, bottom, left: 16, right: 64 };
      }
      return { top: 24, bottom: 36, left: Math.round(rect.right + 16), right: 24 };
    }

    function fit(route) {
      const bounds = new maplibregl.LngLatBounds();
      route.points.forEach((point) => bounds.extend([point[1], point[0]]));
      const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      map.fitBounds(bounds, { padding: padding(), maxZoom: 15, duration: motion ? 0 : 700 });
    }

    function draw(route) {
      map.getSource("course").setData(lineString(route.points));
      map.setPaintProperty("course-line", "line-color", route.color);
      placeEnds(route);
      placeKm(route);
      paintProgress(route);
    }

    function show(id) {
      const route = prepared[id];
      if (!route) return;
      const changed = id !== activeId;
      activeId = id;
      pinned = false;
      if (mapReady) hideHover();
      else resetAlong();
      updatePanel(route);
      if (!mapReady) return;
      draw(route);
      if (changed && tracking) {
        liveGuide = null;
        offRoute = false;
        hideDeviation();
        pathHistory = [];
      }
      if (changed && !(tracking && follow)) fit(route);
      if (changed && tracking && follow) followUser();
    }

    const initial = prepared[location.hash.replace("#", "")] ? location.hash.replace("#", "") : "21";
    if (prepared[initial]) updatePanel(prepared[initial]);

    if (window.maplibregl && window.ROUTES && location.protocol !== "file:") {
    map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [-7.64, 33.59],
      zoom: 12,
      minZoom: 10,
      maxZoom: 18,
      maxPitch: 0,
      attributionControl: false,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false
    });

    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), "bottom-right");
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left");
    map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");

    popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false,
      offset: 16,
      anchor: "bottom",
      className: "course-popup"
    });

    function addCourseLayer(layer, beforeId) {
      if (beforeId && map.getLayer(beforeId)) map.addLayer(layer, beforeId);
      else map.addLayer(layer);
    }

    function addArrowImage() {
      const size = 48;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const g = canvas.getContext("2d");
      g.translate(size / 2, size / 2);
      g.beginPath();
      g.moveTo(14, 0);
      g.lineTo(-8, -11);
      g.lineTo(-8, 11);
      g.closePath();
      g.lineWidth = 5;
      g.lineJoin = "round";
      g.strokeStyle = "#ffffff";
      g.stroke();
      g.fillStyle = "#1c1915";
      g.fill();
      if (!map.hasImage("course-arrow")) {
        map.addImage("course-arrow", g.getImageData(0, 0, size, size), { pixelRatio: 2 });
      }
    }

    map.on("load", () => {
      const beforeId = "highway-name-path";
      addArrowImage();
      map.addSource("course", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

      const layout = { "line-cap": "round", "line-join": "round" };
      addCourseLayer({
        id: "course-shadow",
        type: "line",
        source: "course",
        layout,
        paint: {
          "line-color": "#1c1915",
          "line-opacity": 0.28,
          "line-blur": 0.6,
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 5, 14, 9, 17, 8]
        }
      }, beforeId);
      addCourseLayer({
        id: "course-casing",
        type: "line",
        source: "course",
        layout,
        paint: {
          "line-color": "#fffdf8",
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 4, 14, 7, 17, 6]
        }
      }, beforeId);
      addCourseLayer({
        id: "course-line",
        type: "line",
        source: "course",
        layout,
        paint: {
          "line-color": "#0f6e56",
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 2.5, 14, 4.2, 17, 3.4]
        }
      }, beforeId);
      map.addSource("done", { type: "geojson", data: emptyLine() });
      map.addSource("remaining", { type: "geojson", data: emptyLine() });
      map.addSource("return-path", { type: "geojson", data: emptyLine() });
      addCourseLayer({
        id: "return-path",
        type: "line",
        source: "return-path",
        layout,
        paint: {
          "line-color": "#9a3412",
          "line-width": 3,
          "line-dasharray": [1.4, 1.2]
        }
      }, beforeId);
      addCourseLayer({
        id: "done-line",
        type: "line",
        source: "done",
        layout,
        paint: {
          "line-color": "#8d8478",
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 2.5, 14, 4, 17, 3.2],
          "line-opacity": 0.95
        }
      }, beforeId);
      addCourseLayer({
        id: "remaining-casing",
        type: "line",
        source: "remaining",
        layout,
        paint: {
          "line-color": "#fffdf8",
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 5, 14, 8, 17, 7]
        }
      }, beforeId);
      addCourseLayer({
        id: "remaining-line",
        type: "line",
        source: "remaining",
        layout,
        paint: {
          "line-color": "#0f6e56",
          "line-width": ["interpolate", ["linear"], ["zoom"], 11, 3, 14, 5, 17, 4]
        }
      }, beforeId);
      addCourseLayer({
        id: "course-arrows",
        type: "symbol",
        source: "course",
        minzoom: 14.5,
        layout: {
          "symbol-placement": "line",
          "symbol-spacing": 110,
          "icon-image": "course-arrow",
          "icon-size": 0.55,
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
          "icon-rotation-alignment": "map"
        }
      }, beforeId);

      mapReady = true;
      loading.hidden = true;
      show(initial);
    });

    map.on("zoomend", () => {
      if (mapReady && prepared[activeId]) placeKm(prepared[activeId]);
    });

    map.on("dragstart", () => {
      if (!tracking || !follow) return;
      follow = false;
      updateTrackButtons();
    });

    map.on("mousemove", (event) => {
      if (!mapReady || pinned || tracking || !prepared[activeId]) return;
      const info = closest(event.lngLat, prepared[activeId]);
      if (!info || pixelDistance(info, event.point) > 16) {
        if (hoverMarker) hideHover();
        return;
      }
      showHover(info, false);
    });

    map.on("mouseout", () => {
      if (!pinned) hideHover();
    });

    map.on("click", (event) => {
      if (!mapReady || !prepared[activeId]) return;
      const info = closest(event.lngLat, prepared[activeId]);
      if (!info || pixelDistance(info, event.point) > 20) {
        pinned = false;
        hideHover();
        return;
      }
      pinned = true;
      showHover(info, true);
    });

    map.on("error", (event) => {
      if (mapReady) return;
      const message = String(event && event.error && event.error.message || "");
      if (/style|ajax|fetch|failed|network/i.test(message)) {
        fail("The street map could not be loaded. Check your connection and refresh.");
      }
    });

    document.getElementById("btn-21").addEventListener("click", () => show("21"));
    document.getElementById("btn-42").addEventListener("click", () => show("42"));
    document.getElementById("fit").addEventListener("click", () => {
      follow = false;
      updateTrackButtons();
      if (mapReady && prepared[activeId]) fit(prepared[activeId]);
    });

    document.getElementById("track").addEventListener("click", () => {
      if (tracking) stopTracking();
      else startTracking();
    });

    document.getElementById("recenter").addEventListener("click", () => {
      follow = true;
      lastFollowAt = 0;
      updateTrackButtons();
      followUser();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && tracking) keepAwake();
    });

    const collapseButton = document.getElementById("collapse");
    if (window.matchMedia("(max-width: 720px)").matches) {
      panel.classList.add("is-collapsed");
      collapseButton.setAttribute("aria-expanded", "false");
      collapseButton.textContent = "Details";
    }
    collapseButton.addEventListener("click", () => {
      const collapsed = panel.classList.toggle("is-collapsed");
      collapseButton.setAttribute("aria-expanded", String(!collapsed));
      collapseButton.textContent = collapsed ? "Details" : "Map only";
      if (map) map.resize();
    });

    document.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.target.closest("input, textarea")) return;
      if (event.key === "1") show("21");
      if (event.key === "2") show("42");
    });

    window.addEventListener("resize", () => map.resize());
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => map.resize());
    }
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    }
  </script>
</body>
</html>
